name: Flaky Integration Tests

on:
  push:
    branches: [main]
  schedule:
    # Runs every 30 min to generate failure history quickly during testing
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run flaky integration test
        run: node src/flaky-stabilized.js || echo 'File not found, please check repository'
      - name: Retry failed tests
        run: node src/flaky-stabilized.js || echo 'File not found, please check repository'
        if: failure()